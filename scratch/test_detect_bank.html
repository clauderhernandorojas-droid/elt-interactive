oke-linejoin=\"round\" d=\"M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15\"></path></svg>\n                Reset\n            </button>\n        </div>\n    </header>\n\n    <!-- Main Container (w-full max-w-4xl mx-auto as required) -->\n    <main class=\"w-full max-w-4xl mx-auto p-4 sm:p-6 md:p-8 flex-grow\">\n        \n        <!-- Instructions & Word Bank Card -->\n        <section class=\"bg-white border border-slate-200 rounded-2xl shadow-sm p-5 sm:p-6 mb-6\">\n            <div class=\"flex items-start gap-3 mb-4\">\n                <div class=\"p-2 bg-indigo-50 text-indigo-600 rounded-xl\">\n                    <svg class=\"w-6 h-6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253\"></path></svg>\n                </div>\n                <div>\n                    <h2 class=\"text-lg font-bold text-slate-900\">Vocabulary Exercise</h2>\n                    <p class=\"text-sm text-slate-600 mt-0.5\">Fill in the gaps with these verbs. You can use the verbs more than once.</p>\n                </div>\n            </div>\n\n            <!-- Word Bank -->\n            <div class=\"flex flex-wrap gap-2 pt-2 border-t border-slate-100\">\n                <span class=\"text-xs font-bold text-slate-400 uppercase tracking-wider self-center mr-2\">Word Bank:</span>\n                <span class=\"bg-indigo-50 text-indigo-700 text-sm font-semibold px-3 py-1 rounded-lg border border-indigo-100 shadow-2xs\">do</span>\n                <span class=\"bg-indigo-50 text-indigo-700 text-sm font-semibold px-3 py-1 rounded-lg border border-indigo-100 shadow-2xs\">chat</span>\n                <span class=\"bg-indigo-50 text-indigo-700 text-sm font-semibold px-3 py-1 rounded-lg border border-indigo-100 shadow-2xs\">visit</span>\n                <span class=\"bg-indigo-50 text-indigo-700 text-sm font-semibold px-3 py-1 rounded-lg border border-indigo-100 shadow-2xs\">tidy up</span>\n                <span class=\"bg-indigo-50 text-indigo-700 text-sm font-semibold px-3 py-1 rounded-lg border border-indigo-100 shadow-2xs\">have</span>\n                <span class=\"bg-indigo-50 text-indigo-700 text-sm font-semibold px-3 py-1 rounded-lg border border-indigo-100 shadow-2xs\">go</span>\n                <span class=\"bg-indigo-50 text-indigo-700 text-sm font-semibold px-3 py-1 rounded-lg border border-indigo-100 shadow-2xs\">meet</span>\n            </div>\n        </section>\n\n        <!-- Questions Form -->\n        <form id=\"quiz-form\" class=\"bg-white border border-slate-200 rounded-2xl shadow-sm p-5 sm:p-8 space-y-4\">\n            \n            <!-- Item 1 (Example) -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2 border-b border-slate-100\">\n                <span class=\"flex-none font-bold text-slate-400 w-6 text-right\">1.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>I often</span>\n                    <input type=\"text\" value=\"do\" disabled class=\"bg-slate-100 text-slate-500 font-medium px-3 py-1.5 rounded-lg border border-slate-200 w-28 text-center cursor-not-allowed\">\n                    <span>some gardening at the weekend. <span class=\"text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded ml-1\">(Example)</span></span>\n                </div>\n            </div>\n\n            <!-- Item 2 -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2 border-b border-slate-100\">\n                <span class=\"flex-none font-bold text-slate-700 w-6 text-right\">2.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>We usually</span>\n                    <input type=\"text\" data-answer=\"visit\" autocomplete=\"off\" autocapitalize=\"none\" placeholder=\"type verb...\" class=\"bg-slate-50 focus:bg-white text-slate-800 font-medium px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all w-36 text-center\">\n                    <span>my grandmother on Sundays.</span>\n                </div>\n            </div>\n\n            <!-- Item 3 -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2 border-b border-slate-100\">\n                <span class=\"flex-none font-bold text-slate-700 w-6 text-right\">3.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>When did you last</span>\n                    <input type=\"text\" data-answer=\"tidy up\" autocomplete=\"off\" autocapitalize=\"none\" placeholder=\"type verb...\" class=\"bg-slate-50 focus:bg-white text-slate-800 font-medium px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all w-36 text-center\">\n                    <span>the flat?</span>\n                </div>\n            </div>\n\n            <!-- Item 4 -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2 border-b border-slate-100\">\n                <span class=\"flex-none font-bold text-slate-700 w-6 text-right\">4.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>I think I'll</span>\n                    <input type=\"text\" data-answer=\"have\" autocomplete=\"off\" autocapitalize=\"none\" placeholder=\"type verb...\" class=\"bg-slate-50 focus:bg-white text-slate-800 font-medium px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all w-36 text-center\">\n                    <span>a quiet night in.</span>\n                </div>\n            </div>\n\n            <!-- Item 5 -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2 border-b border-slate-100\">\n                <span class=\"flex-none font-bold text-slate-700 w-6 text-right\">5.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>We often</span>\n                    <input type=\"text\" data-answer=\"go\" autocomplete=\"off\" autocapitalize=\"none\" placeholder=\"type verb...\" class=\"bg-slate-50 focus:bg-white text-slate-800 font-medium px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all w-36 text-center\">\n                    <span>clubbing with friends.</span>\n                </div>\n            </div>\n\n            <!-- Item 6 -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2 border-b border-slate-100\">\n                <span class=\"flex-none font-bold text-slate-700 w-6 text-right\">6.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>I never</span>\n                    <input type=\"text\" data-answer=\"have\" autocomplete=\"off\" autocapitalize=\"none\" placeholder=\"type verb...\" class=\"bg-slate-50 focus:bg-white text-slate-800 font-medium px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all w-36 text-center\">\n                    <span>a lie-in on Saturday mornings.</span>\n                </div>\n            </div>\n\n            <!-- Item 7 -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2 border-b border-slate-100\">\n                <span class=\"flex-none font-bold text-slate-700 w-6 text-right\">7.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>My sister and I often</span>\n                    <input type=\"text\" data-answer=\"chat\" autocomplete=\"off\" autocapitalize=\"none\" placeholder=\"type verb...\" class=\"bg-slate-50 focus:bg-white text-slate-800 font-medium px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all w-36 text-center\">\n                    <span>to people online.</span>\n                </div>\n            </div>\n\n            <!-- Item 8 -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2 border-b border-slate-100\">\n                <span class=\"flex-none font-bold text-slate-700 w-6 text-right\">8.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>I really need to</span>\n                    <input type=\"text\" data-answer=\"do\" autocomplete=\"off\" autocapitalize=\"none\" placeholder=\"type verb...\" class=\"bg-slate-50 focus:bg-white text-slate-800 font-medium px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all w-36 text-center\">\n                    <span>some exercise.</span>\n                </div>\n            </div>\n\n            <!-- Item 9 -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2 border-b border-slate-100\">\n                <span class=\"flex-none font-bold text-slate-700 w-6 text-right\">9.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>We hardly ever</span>\n                    <input type=\"text\" data-answer=\"go\" autocomplete=\"off\" autocapitalize=\"none\" placeholder=\"type verb...\" class=\"bg-slate-50 focus:bg-white text-slate-800 font-medium px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all w-36 text-center\">\n                    <span>to exhibitions.</span>\n                </div>\n            </div>\n\n            <!-- Item 10 -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2 border-b border-slate-100\">\n                <span class=\"flex-none font-bold text-slate-700 w-6 text-right\">10.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>I sometimes</span>\n                    <input type=\"text\" data-answer=\"have\" autocomplete=\"off\" autocapitalize=\"none\" placeholder=\"type verb...\" class=\"bg-slate-50 focus:bg-white text-slate-800 font-medium px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all w-36 text-center\">\n                    <span>friends round for dinner.</span>\n                </div>\n            </div>\n\n            <!-- Item 11 -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2\">\n                <span class=\"flex-none font-bold text-slate-700 w-6 text-right\">11.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>Sam's going to</span>\n                    <input type=\"text\" data-answer=\"meet\" autocomplete=\"off\" autocapitalize=\"none\" placeholder=\"type verb...\" class=\"bg-slate-50 focus:bg-white text-slate-800 font-medium px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all w-36 text-center\">\n                    <span>up with some friends.</span>\n                </div>\n            </div>\n\n            <!-- Submit Button Bar -->\n            <div class=\"pt-6 border-t border-slate-200 flex flex-wrap items-center justify-between gap-4\">\n                <p id=\"feedback-msg\" class=\"text-sm font-medium text-slate-500\">Fill in all gaps and click check answers.</p>\n                <button type=\"submit\" id=\"check-btn\" class=\"w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl transition-all shadow-sm cursor-pointer flex items-center justify-center gap-2 min-h-[44px]\">\n                    <svg class=\"w-5 h-5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M5 13l4 4L19 7\"></path></svg>\n                    Check Answers\n                </button>\n            </div>\n        </form>\n\n        <!-- Additional Note Section as requested by the professor -->\n        <section class=\"mt-6 bg-amber-50 border border-amber-200 rounded-2xl p-5 sm:p-6 text-amber-900 shadow-2xs\">\n            <div class=\"flex items-start gap-3\">\n                <div class=\"p-2 bg-amber-100 text-amber-700 rounded-xl mt-0.5\">\n                    <svg class=\"w-5 h-5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z\"></path></svg>\n                </div>\n                <div>\n                    <h3 class=\"font-bold text-amber-900 text-sm sm:text-base\">Additional Note / Part C Reference</h3>\n                    <p class=\"text-xs sm:text-sm text-amber-800 mt-1 leading-relaxed\">\n                        Remember to review your collocations regularly. Practice using these verb phrases in your daily conversations to build natural fluency and expand your active vocabulary for weekend routines.\n                    </p>\n                </div>\n            </div>\n        </section>\n\n    </main>\n\n    <!-- Footer -->\n    <footer class=\"text-center py-4 text-xs text-slate-400 border-t border-slate-100 mt-auto\">\n        ELT Interactive Micro-App &bull; Progress Test 1\n    </footer>\n\n    <!-- Interactive Script & Metrics Contract -->\n    <script>\n        // MANDATORY PEDAGOGICAL METRICS CONTRACT\n        window.ACTIVITY_METRICS = {\n            domain: 'Vocabulary',\n            skill: 'weekend_activities_collocations',\n            maxScore: 11\n        };\n\n        document.addEventListener('DOMContentLoaded', () => {\n            const form = document.getElementById('quiz-form');\n            const checkBtn = document.getElementById('check-btn');\n            const resetBtn = document.getElementById('reset-btn');\n            const currentScoreSpan = document.getElementById('current-score');\n            const feedbackMsg = document.getElementById('feedback-msg');\n            const inputs = form.querySelectorAll('input[data-answer]');\n\n            document.getElementById('total-score').textContent = inputs.length;\n\n            form.addEventListener('submit', (e) => {\n                e.preventDefault();\n                let correctCount = 0;\n\n                inputs.forEach(input => {\n                    const userAnswer = input.value.trim().toLowerCase();\n                    const correctAnswer = input.getAttribute('data-answer').toLowerCase();\n\n                    input.classList.remove('is-correct', 'is-wrong');\n\n                    if (userAnswer === correctAnswer) {\n                        input.classList.add('is-correct');\n                        correctCount++;\n                    } else {\n                        input.classList.add('is-wrong');\n                    }\n                });\n\n                currentScoreSpan.textContent = correctCount;\n\n                if (correctCount === inputs.length) {\n                    feedbackMsg.textContent = '🎉 Excellent! All answers are correct.';\n                    feedbackMsg.className = 'text-sm font-bold text-emerald-600';\n                } else {\n                    feedbackMsg.textContent = `You got ${correctCount} out of ${inputs.length} correct. Review the highlighted items.`;\n                    feedbackMsg.className = 'text-sm font-bold text-amber-600';\n                }\n\n                // DISPATCH MANDATORY CUSTOM EVENT & POSTMESSAGE\n                window.dispatchEvent(new CustomEvent('ELT_ACTIVITY_UPDATE', {\n                    detail: {\n                        metrics: window.ACTIVITY_METRICS,\n                        score: correctCount,\n                        total: inputs.length,\n                        completed: correctCount === inputs.length\n                    }\n                }));\n\n                try {\n                    window.parent.postMessage({\n                        type: 'ACTIVITY_SCORE',\n                        score: correctCount,\n                        total: inputs.length\n                    }, '*');\n                } catch (err) {\n                    console.log('PostMessage not available');\n                }\n            });\n\n            resetBtn.addEventListener('click', () => {\n                inputs.forEach(input => {\n                    input.value = '';\n                    input.classList.remove('is-correct', 'is-wrong');\n                });\n                currentScoreSpan.textContent = '0';\n                feedbackMsg.textContent = 'Fill in all gaps and click check answers.';\n                feedbackMsg.className = 'text-sm font-medium text-slate-500';\n            });\n        });\n    <\/script>\n</body>\n</html>", 'text/html');

const candidateContainers = new Set(doc.querySelectorAll('.word-bank, .wordbank, [data-word-bank], .chips-container, [data-chips], [data-matching-options], .matching-options, .match-targets'));

// Also check for elements whose text indicates a bank
doc.querySelectorAll('span, h2, h3, h4, h5, div, p').forEach(el => {
  if (el.children.length === 0 && /\b(word|vocabulary|adverb|verbs?)\s*bank\b:?/i.test(el.textContent.trim())) {
    if (el.parentElement) candidateContainers.add(el.parentElement);
  }
});

let found = [];
candidateContainers.forEach(cont => {
  const children = Array.from(cont.children);
  const chips = children.filter(c => {
    const text = c.textContent.trim();
    if (/\b(word|vocabulary|adverb|verbs?)\s*bank\b:?/i.test(text)) return false;
    return true;
  });
  found.push({
    tag: cont.tagName,
    classes: cont.className,
    chipCount: chips.length,
    chips: chips.map(c => c.textContent.trim())
  });
});

document.getElementById('res').textContent = JSON.stringify(found, null, 2);
</script>
