function shuffleExerciseOptions(rawHtml) {
  if (!rawHtml || typeof rawHtml !== 'string') return rawHtml;

  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(rawHtml, 'text/html');

    // Helper: Fisher-Yates shuffle array in-place
    function fyShuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = arr[i];
        arr[i] = arr[j];
        arr[j] = t;
      }
      return arr;
    }

    // Helper: shuffle a list of DOM elements inside their common parent container
    function shuffleElementsInParent(elements, parent) {
      if (!elements || elements.length <= 1) return;
      const p = parent || elements[0].parentElement;
      if (!p) return;

      const firstEl = elements[0];
      const anchor = document.createComment('shuffle-anchor');
      p.insertBefore(anchor, firstEl);

      const shuffled = fyShuffle(elements.slice(0));

      let ref = anchor;
      shuffled.forEach(el => {
        p.insertBefore(el, ref.nextSibling);
        ref = el;
      });

      anchor.remove();
    }

    // 1. SHUFFLE <select> OPTIONS
    doc.querySelectorAll('select').forEach(sel => {
      const opts = Array.from(sel.querySelectorAll('option'));
      if (opts.length <= 2) return;

      const first = opts[0];
      const isPlh = first.value === '' ||
        /--|select|choose|elige/i.test(first.textContent) ||
        (!first.hasAttribute('data-answer') && !first.hasAttribute('data-correct') && !first.value.trim());

      const toShuffle = isPlh ? opts.slice(1) : opts.slice(0);
      if (toShuffle.length <= 1) return;

      fyShuffle(toShuffle);

      if (isPlh) {
        sel.appendChild(first);
      }
      toShuffle.forEach(o => sel.appendChild(o));
    });

    // 2. SHUFFLE RADIO GROUPS (input[type="radio"])
    const radioGroups = {};
    doc.querySelectorAll('input[type="radio"][name]').forEach(r => {
      const name = r.getAttribute('name');
      if (!radioGroups[name]) radioGroups[name] = [];
      radioGroups[name].push(r);
    });

    Object.values(radioGroups).forEach(radios => {
      if (radios.length <= 1) return;
      const items = radios.map(r => r.closest('label') || r.closest('.radio-option') || r.parentElement || r);
      const parent = items[0].parentElement;
      if (!parent) return;
      const allSameParent = items.every(it => it.parentElement === parent);
      const allUnique = (new Set(items)).size === items.length;
      if (allSameParent && allUnique) {
        shuffleElementsInParent(items, parent);
      }
    });

    // 3. SHUFFLE MULTIPLE CHOICE BUTTONS / GROUPS
    const btnGroups = {};
    const qButtons = doc.querySelectorAll('button[data-question], button[data-q], button[data-item]');
    qButtons.forEach(btn => {
      if (btn.matches('#check-btn, #reset-btn, [onclick*="check"], [onclick*="reset"], [onclick*="toggle"]')) return;
      const q = btn.getAttribute('data-question') || btn.getAttribute('data-q') || btn.getAttribute('data-item');
      if (!btnGroups[q]) btnGroups[q] = [];
      btnGroups[q].push(btn);
    });

    const shuffledBtnParents = new Set();

    Object.values(btnGroups).forEach(btns => {
      if (btns.length <= 1) return;
      const parent = btns[0].parentElement;
      if (!parent) return;
      const allSame = btns.every(b => b.parentElement === parent);
      if (allSame) {
        shuffleElementsInParent(btns, parent);
        shuffledBtnParents.add(parent);
      }
    });

    const choiceContainers = doc.querySelectorAll('.options-group, .choice-group, .btn-group, [data-choice-group], [data-options], [id^="options-"]');
    choiceContainers.forEach(cont => {
      if (shuffledBtnParents.has(cont)) return;
      const btns = Array.from(cont.querySelectorAll('button:not(#check-btn):not(#reset-btn):not([onclick*="check"]):not([onclick*="reset"]):not([onclick*="toggle"])'));
      if (btns.length > 1) {
        const directParent = btns[0].parentElement;
        const allSame = btns.every(b => b.parentElement === directParent);
        if (allSame) {
          shuffleElementsInParent(btns, directParent);
          shuffledBtnParents.add(directParent);
        }
      }
    });

    // 4. SHUFFLE WORD BANKS AND MATCHING CHIP CONTAINERS
    const bankContainers = new Set(doc.querySelectorAll('.word-bank, .wordbank, [data-word-bank], .chips-container, [data-chips], [data-matching-options], .matching-options, .match-targets'));
    doc.querySelectorAll('span, h2, h3, h4, h5, div, p').forEach(el => {
      if (el.children.length === 0 && /\b(word|vocabulary|adverb|verbs?)\s*bank\b:?/i.test(el.textContent.trim())) {
        if (el.parentElement) bankContainers.add(el.parentElement);
      }
    });

    bankContainers.forEach(bank => {
      const children = Array.from(bank.children);
      const chips = children.filter(c => {
        const text = c.textContent.trim();
        if (/\b(word|vocabulary|adverb|verbs?)\s*bank\b:?/i.test(text)) return false;
        if (c.matches('h1, h2, h3, h4, h5, h6, [class*="uppercase"]')) {
          if (text.includes(':') || /bank/i.test(text)) return false;
        }
        return true;
      });

      if (chips.length > 1) {
        shuffleElementsInParent(chips, bank);
      }
    });

    const docTypeStr = (rawHtml.trim().startsWith('<!DOCTYPE') || doc.doctype) ? '<!DOCTYPE html>\n' : '';
    return docTypeStr + doc.documentElement.outerHTML;
  } catch (err) {
    console.warn('Error in shuffleExerciseOptions:', err);
    return rawHtml;
  }
}

>\n\n            </div>\n        </main>\n\n        <!-- Action Footer -->\n        <footer class=\"bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-6 flex flex-col md:flex-row items-center justify-between gap-4\">\n            <div id=\"score-display\" class=\"text-base font-semibold text-slate-700\">\n                Score: <span id=\"correct-count\">0</span> / 4\n            </div>\n            \n            <div class=\"flex items-center gap-3 w-full md:w-auto\">\n                <button id=\"reset-btn\" class=\"touch-target flex-1 md:flex-none px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 font-semibold hover:bg-slate-100 active:bg-slate-200 transition-colors\">\n                    Reset\n                </button>\n                <button id=\"check-btn\" class=\"touch-target flex-1 md:flex-none px-6 py-2.5 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700 active:bg-indigo-800 transition-colors shadow-sm\">\n                    Check Answers\n                </button>\n            </div>\n        </footer>\n\n    </div>\n\n    <script>\n        const correctAnswers = {\n            \"2\": \"2\",\n            \"3\": \"3\",\n            \"4\": \"4\",\n            \"5\": \"5\"\n        };\n\n        const checkBtn = document.getElementById('check-btn');\n        const resetBtn = document.getElementById('reset-btn');\n        const selects = document.querySelectorAll('.answer-select');\n        const correctCountSpan = document.getElementById('correct-count');\n\n        checkBtn.addEventListener('click', () => {\n            let correctCount = 0;\n            const total = Object.keys(correctAnswers).length;\n\n            selects.forEach(select => {\n                const slot = select.getAttribute('data-index');\n                const val = select.value;\n                \n                // Remove previous color rings\n                select.classList.remove('border-emerald-600', 'bg-emerald-50', 'border-red-600', 'bg-red-50');\n\n                if (val === correctAnswers[slot]) {\n                    correctCount++;\n                    select.classList.add('border-emerald-600', 'bg-emerald-50', 'text-emerald-900');\n                } else {\n                    select.classList.add('border-red-600', 'bg-red-50', 'text-red-900');\n                }\n            });\n\n            correctCountSpan.textContent = correctCount;\n\n            // Send score to parent container if embedded\n            window.parent.postMessage({\n                type: 'ACTIVITY_SCORE',\n                score: correctCount,\n                total: total\n            }, '*');\n        });\n\n        resetBtn.addEventListener('click', () => {\n            selects.forEach(select => {\n                select.value = \"\";\n                select.classList.remove('border-emerald-600', 'bg-emerald-50', 'text-emerald-900', 'border-red-600', 'bg-red-50', 'text-red-900');\n            });\n            correctCountSpan.textContent = \"0\";\n            window.parent.postMessage({\n                type: 'ACTIVITY_SCORE',\n                score: 0,\n                total: 4\n            }, '*');\n        });\n    <\/script>\n</body>\n</html>", selector: 'select option' },
  { name: '2c.html Slide 3 (Radios)', html: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>The Science of Sleep - Interactive Reading Activity</title>\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <style>\n        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');\n        body { font-family: 'Inter', sans-serif; }\n    </style>\n</head>\n<body class=\"bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between\">\n\n    <!-- STICKY HEADER WITH SCORE COUNTER & PROGRESS -->\n    <header class=\"sticky top-0 bg-white/95 backdrop-blur z-20 py-2.5 px-4 border-b w-full shadow-sm\">\n        <div class=\"max-w-3xl mx-auto flex items-center justify-between\">\n            <div class=\"flex items-center space-x-2\">\n                <span class=\"bg-indigo-100 text-indigo-700 font-bold p-2 rounded-lg text-xs md:text-sm flex items-center gap-1.5\">\n                    <svg xmlns=\"http://www.w3.org/2000/svg\" class=\"h-4 w-4\" fill=\"none\" viewBox=\"0 0 24 24\" stroke=\"currentColor\">\n                        <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253\" />\n                    </svg>\n                    Reading Comprehension\n                </span>\n            </div>\n            <div id=\"score-badge\" class=\"font-semibold text-sm bg-slate-100 text-slate-700 px-3 py-1.5 rounded-full border border-slate-200 transition-all\">\n                Score: <span id=\"current-score\" class=\"text-indigo-600 font-bold\">0</span> / <span id=\"total-questions\">6</span>\n            </div>\n        </div>\n    </header>\n\n    <!-- MAIN CONTENT CONTAINER -->\n    <main class=\"w-full max-w-3xl mx-auto p-3 md:p-6 flex-grow space-y-6\">\n\n        <!-- TITLE & INTRO -->\n        <section class=\"bg-white rounded-2xl p-5 shadow-sm border border-slate-100\">\n            <h1 class=\"text-xl md:text-2xl font-bold text-slate-900 mb-2\">The science of sleep</h1>\n            <p class=\"text-sm text-slate-600 leading-relaxed\">\n                Sleep is one of the body's most mysterious experiences. Scientists don't completely understand the process, but it seems that all living things need some sleep. And some need a lot more than others!\n            </p>\n        </section>\n\n        <!-- REFERENCE ARTICLE ACCORDION / TOGGLE -->\n        <section class=\"bg-indigo-50/50 rounded-2xl border border-indigo-100 overflow-hidden\">\n            <button onclick=\"toggleArticle()\" class=\"w-full p-4 flex items-center justify-between text-left font-semibold text-indigo-900 bg-indigo-50 hover:bg-indigo-100/70 transition-colors focus:outline-none min-h-[48px]\">\n                <span class=\"flex items-center gap-2 text-sm md:text-base\">\n                    <svg xmlns=\"http://www.w3.org/2000/svg\" class=\"h-5 w-5 text-indigo-600\" fill=\"none\" viewBox=\"0 0 24 24\" stroke=\"currentColor\">\n                        <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z\" />\n                    </svg>\n                    Read the Reference Article (Click to toggle)\n                </span>\n                <svg id=\"arrow-icon\" xmlns=\"http://www.w3.org/2000/svg\" class=\"h-5 w-5 text-indigo-600 transform transition-transform duration-200\" fill=\"none\" viewBox=\"0 0 24 24\" stroke=\"currentColor\">\n                    <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M19 9l-7 7-7-7\" />\n                </svg>\n            </button>\n            <div id=\"article-content\" class=\"p-5 space-y-4 text-sm text-slate-700 bg-white border-t border-indigo-100\">\n                <div>\n                    <h3 class=\"font-bold text-indigo-900 mb-1\">1. Stages of Sleep</h3>\n                    <p>There are five stages of sleep: stages 1, 2, 3, 4 and REM (rapid* eye movement). In stages 1 to 4 our body becomes more relaxed. Our muscles and heart rate slow down and our brain becomes less active. Stage 5 is called REM sleep. Our heart beats faster and our eyes move quickly in different directions. People dream during this stage and we cannot move at all – probably to stop us from doing the actions in our dreams.</p>\n                </div>\n                <div>\n                    <h3 class=\"font-bold text-indigo-900 mb-1\">2. Why We Sleep</h3>\n                    <p>An average person spends almost a third of their life sleeping! Is it a waste of time? Scientists believe that when the heart and brain slow down, the body is recovering* after the day's work. They also think that REM sleep is important for memory and learning – babies have twice as much REM sleep as adults.</p>\n                </div>\n                <div>\n                    <h3 class=\"font-bold text-indigo-900 mb-1\">3. Sleep Duration</h3>\n                    <p>On average an adult needs about 7–8 hours' sleep every day. A baby needs 12–16. In the animal world, bats sleep for about 20 hours every day. But a giraffe sleeps for only an hour or two every night.</p>\n                </div>\n                <div class=\"text-xs text-slate-500 pt-2 border-t border-slate-100\">\n                    <p>*rapid = very quick</p>\n                    <p>*recover = get back your strength</p>\n                </div>\n            </div>\n        </section>\n\n        <!-- INTERACTIVE EXERCISE SECTION -->\n        <section class=\"bg-white rounded-2xl p-4 md:p-6 shadow-sm border border-slate-100 space-y-6\">\n            <div>\n                <h2 class=\"text-base md:text-lg font-bold text-slate-900\">3. Read the article again and answer the questions.</h2>\n                <p class=\"text-xs text-slate-500 mt-0.5\">Select the correct answer for each question based on the text.</p>\n            </div>\n\n            <div class=\"space-y-6\">\n                <!-- Question 1 -->\n                <div class=\"p-4 bg-slate-50 rounded-xl border border-slate-200/80 space-y-3\" id=\"q1-container\">\n                    <label class=\"block font-medium text-sm text-slate-900\">\n                        <span class=\"font-bold text-indigo-600 mr-1.5\">1.</span> What happens to your heart in stages 1 to 4 of sleep?\n                    </label>\n                    <div class=\"space-y-2\">\n                        <label class=\"flex items-center space-x-3 p-2.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 cursor-pointer min-h-[42px]\">\n                            <input type=\"radio\" name=\"q1\" value=\"wrong\" class=\"h-4 w-4 text-indigo-600\">\n                            <span class=\"text-sm\">It beats faster and pumps extra blood.</span>\n                        </label>\n                        <label class=\"flex items-center space-x-3 p-2.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 cursor-pointer min-h-[42px]\">\n                            <input type=\"radio\" name=\"q1\" value=\"correct\" class=\"h-4 w-4 text-indigo-600\">\n                            <span class=\"text-sm\">It slows down.</span>\n                        </label>\n                        <label class=\"flex items-center space-x-3 p-2.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 cursor-pointer min-h-[42px]\">\n                            <input type=\"radio\" name=\"q1\" value=\"wrong\" class=\"h-4 w-4 text-indigo-600\">\n                            <span class=\"text-sm\">It stops completely for short moments.</span>\n                        </label>\n                    </div>\n                </div>\n\n                <!-- Question 2 -->\n                <div class=\"p-4 bg-slate-50 rounded-xl border border-slate-200/80 space-y-3\" id=\"q2-container\">\n                    <label class=\"block font-medium text-sm text-slate-900\">\n                        <span class=\"font-bold text-indigo-600 mr-1.5\">2.</span> Why is stage 5 called REM?\n                    </label>\n                    <div class=\"space-y-2\">\n                        <label class=\"flex items-center space-x-3 p-2.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 cursor-pointer min-h-[42px]\">\n                            <input type=\"radio\" name=\"q2\" value=\"wrong\" class=\"h-4 w-4 text-indigo-600\">\n                            <span class=\"text-sm\">Because our eyes are completely still and closed.</span>\n                        </label>\n                        <label class=\"flex items-center space-x-3 p-2.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 cursor-pointer min-h-[42px]\">\n                            <input type=\"radio\" name=\"q2\" value=\"correct\" class=\"h-4 w-4 text-indigo-600\">\n                            <span class=\"text-sm\">Because our eyes move quickly in different directions.</span>\n                        </label>\n                        <label class=\"flex items-center space-x-3 p-2.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 cursor-pointer min-h-[42px]\">\n                            <input type=\"radio\" name=\"q2\" value=\"wrong\" class=\"h-4 w-4 text-indigo-600\">\n                            <span class=\"text-sm\">Because we wake up rapidly during this stage.</span>\n                        </label>\n                    </div>\n                </div>\n\n                <!-- Question 3 -->\n                <div class=\"p-4 bg-slate-50 rounded-xl border border-slate-200/80 space-y-3\" id=\"q3-container\">\n                    <label class=\"block font-medium text-sm text-slate-900\">\n                        <span class=\"font-bold text-indigo-600 mr-1.5\">3.</span> Why do we need stages 1 to 4 of sleep?\n                    </label>\n                    <div class=\"space-y-2\">\n                        <label class=\"flex items-center space-x-3 p-2.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 cursor-pointer min-h-[42px]\">\n                            <input type=\"radio\" name=\"q3\" value=\"correct\" class=\"h-4 w-4 text-indigo-600\">\n                            <span class=\"text-sm\">Because our body becomes more relaxed.</span>\n                        </label>\n                        <label class=\"flex items-center space-x-3 p-2.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 cursor-pointer min-h-[42px]\">\n                            <input type=\"radio\" name=\"q3\" value=\"wrong\" class=\"h-4 w-4 text-indigo-600\">\n                            <span class=\"text-sm\">To help us learn new foreign languages faster.</span>\n                        </label>\n                        <label class=\"flex items-center space-x-3 p-2.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 cursor-pointer min-h-[42px]\">\n                            <input type=\"radio\" name=\"q3\" value=\"wrong\" class=\"h-4 w-4 text-indigo-600\">\n                            <span class=\"text-sm\">To process complex mathematical problems.</span>\n                        </label>\n                    </div>\n                </div>\n\n                <!-- Question 4 -->\n                <div class=\"p-4 bg-slate-50 rounded-xl border border-slate-200/80 space-y-3\" id=\"q4-container\">\n                    <label class=\"block font-medium text-sm text-slate-900\">\n                        <span class=\"font-bold text-indigo-600 mr-1.5\">4.</span> What happens during REM sleep?\n                    </label>\n                    <div class=\"space-y-2\">\n                        <label class=\"flex items-center space-x-3 p-2.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 cursor-pointer min-h-[42px]\">\n                            <input type=\"radio\" name=\"q4\" value=\"wrong\" class=\"h-4 w-4 text-indigo-600\">\n                            <span class=\"text-sm\">We run around and perform actions in our sleep.</span>\n                        </label>\n                        <label class=\"flex items-center space-x-3 p-2.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 cursor-pointer min-h-[42px]\">\n                            <input type=\"radio\" name=\"q4\" value=\"wrong\" class=\"h-4 w-4 text-indigo-600\">\n                            <span class=\"text-sm\">We remember everything we did during the day clearly.</span>\n                        </label>\n                        <label class=\"flex items-center space-x-3 p-2.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 cursor-pointer min-h-[42px]\">\n                            <input type=\"radio\" name=\"q4\" value=\"correct\" class=\"h-4 w-4 text-indigo-600\">\n                            <span class=\"text-sm\">We dream and we cannot move at all.</span>\n                        </label>\n                    </div>\n                </div>\n\n                <!-- Question 5 -->\n                <div class=\"p-4 bg-slate-50 rounded-xl border border-slate-200/80 space-y-3\" id=\"q5-container\">\n                    <label class=\"block font-medium text-sm text-slate-900\">\n                        <span class=\"font-bold text-indigo-600 mr-1.5\">5.</span> Why is REM sleep important to babies?\n                    </label>\n                    <div class=\"space-y-2\">\n                        <label class=\"flex items-center space-x-3 p-2.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 cursor-pointer min-h-[42px]\">\n                            <input type=\"radio\" name=\"q5\" value=\"wrong\" class=\"h-4 w-4 text-indigo-600\">\n                            <span class=\"text-sm\">Because it helps them grow taller physically.</span>\n                        </label>\n                        <label class=\"flex items-center space-x-3 p-2.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 cursor-pointer min-h-[42px]\">\n                            <input type=\"radio\" name=\"q5\" value=\"correct\" class=\"h-4 w-4 text-indigo-600\">\n                            <span class=\"text-sm\">Because scientists think it is important for memory and learning.</span>\n                        </label>\n                        <label class=\"flex items-center space-x-3 p-2.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 cursor-pointer min-h-[42px]\">\n                            <input type=\"radio\" name=\"q5\" value=\"wrong\" class=\"h-4 w-4 text-indigo-600\">\n                            <span class=\"text-sm\">Because it stops them from waking up hungry.</span>\n                        </label>\n                    </div>\n                </div>\n\n                <!-- Question 6 -->\n                <div class=\"p-4 bg-slate-50 rounded-xl border border-slate-200/80 space-y-3\" id=\"q6-container\">\n                    <label class=\"block font-medium text-sm text-slate-900\">\n                        <span class=\"font-bold text-indigo-600 mr-1.5\">6.</span> Put these in order of the amount of sleep they need (least to most):\n                    </label>\n                    <div class=\"space-y-2\">\n                        <label class=\"flex items-center space-x-3 p-2.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 cursor-pointer min-h-[42px]\">\n                            <input type=\"radio\" name=\"q6\" value=\"wrong\" class=\"h-4 w-4 text-indigo-600\">\n                            <span class=\"text-sm\">Babies, adults, bats, giraffes.</span>\n                        </label>\n                        <label class=\"flex items-center space-x-3 p-2.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 cursor-pointer min-h-[42px]\">\n                            <input type=\"radio\" name=\"q6\" value=\"wrong\" class=\"h-4 w-4 text-indigo-600\">\n                            <span class=\"text-sm\">Adults, babies, giraffes, bats.</span>\n                        </label>\n                        <label class=\"flex items-center space-x-3 p-2.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 cursor-pointer min-h-[42px]\">\n                            <input type=\"radio\" name=\"q6\" value=\"correct\" class=\"h-4 w-4 text-indigo-600\">\n                            <span class=\"text-sm\">Giraffes, adults, babies, bats.</span>\n                        </label>\n                    </div>\n                </div>\n            </div>\n\n            <!-- ACTION BUTTONS -->\n            <div class=\"flex flex-col sm:flex-row gap-3 pt-4 border-t border-slate-100\">\n                <button onclick=\"checkAnswers()\" class=\"w-full sm:flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-6 rounded-xl transition-colors shadow-sm active:scale-[0.99] min-h-[48px]\">\n                    Check Answers\n                </button>\n                <button onclick=\"resetActivity()\" class=\"w-full sm:w-auto bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-3 px-6 rounded-xl transition-colors min-h-[48px]\">\n                    Reset\n                </button>\n            </div>\n        </section>\n    </main>\n\n    <!-- FOOTER -->\n    <footer class=\"text-center py-6 text-xs text-slate-400 border-t border-slate-200/60 mt-8\">\n        Interactive ELT Reading Activity • The Science of Sleep\n    </footer>\n\n    <!-- INTERACTION LOGIC SCRIPT -->\n    <script>\n        function toggleArticle() {\n            const content = document.getElementById('article-content');\n            const arrow = document.getElementById('arrow-icon');\n            if (content.style.maxHeight && content.style.maxHeight !== '0px') {\n                content.style.maxHeight = '0px';\n                content.style.overflow = 'hidden';\n                arrow.style.transform = 'rotate(0deg)';\n            } else {\n                content.style.maxHeight = content.scrollHeight + 'px';\n                content.style.overflow = 'visible';\n                arrow.style.transform = 'rotate(180deg)';\n            }\n        }\n\n        // Initialize article open by default or closed smoothly\n        window.addEventListener('DOMContentLoaded', () => {\n            const content = document.getElementById('article-content');\n            content.style.transition = 'max-height 0.3s ease-in-out';\n            content.style.maxHeight = content.scrollHeight + 'px';\n        });\n\n        function checkAnswers() {\n            let correctCount = 0;\n            const total = 6;\n\n            for (let i = 1; i <= total; i++) {\n                const container = document.getElementById(`q${i}-container`);\n                const selected = document.querySelector(`input[name=\"q${i}\"]:checked`);\n                \n                // Clear previous validation styling\n                container.classList.remove('bg-emerald-50', 'border-emerald-300', 'bg-rose-50', 'border-rose-300');\n                \n                if (selected) {\n                    if (selected.value === 'correct') {\n                        correctCount++;\n                        container.classList.add('bg-emerald-50/70', 'border-emerald-300');\n                    } else {\n                        container.classList.add('bg-rose-50/70', 'border-rose-300');\n                    }\n                } else {\n                    container.classList.add('bg-rose-50/70', 'border-rose-300');\n                }\n            }\n\n            // Update score display\n            document.getElementById('current-score').textContent = correctCount;\n            const badge = document.getElementById('score-badge');\n            badge.className = `font-semibold text-sm px-3 py-1.5 rounded-full border transition-all ${correctCount === total ? 'bg-emerald-100 text-emerald-800 border-emerald-300' : 'bg-indigo-50 text-indigo-800 border-indigo-200'}`;\n\n            // Send score to parent frame if embedded\n            try {\n                window.parent.postMessage({ type: 'ACTIVITY_SCORE', score: correctCount, total: total }, '*');\n            } catch (e) {\n                console.log('Score posted locally:', correctCount, '/', total);\n            }\n        }\n\n        function resetActivity() {\n            for (let i = 1; i <= 6; i++) {\n                const container = document.getElementById(`q${i}-container`);\n                container.classList.remove('bg-emerald-50/70', 'border-emerald-300', 'bg-rose-50/70', 'border-rose-300');\n                const radios = document.querySelectorAll(`input[name=\"q${i}\"]`);\n                radios.forEach(radio => radio.checked = false);\n            }\n\n            document.getElementById('current-score').textContent = '0';\n            const badge = document.getElementById('score-badge');\n            badge.className = 'font-semibold text-sm bg-slate-100 text-slate-700 px-3 py-1.5 rounded-full border border-slate-200 transition-all';\n        }\n    <\/script>\n</body>\n</html>", selector: 'input[name="q1"]' },
  { name: 'Unit 1 Test Slide 1 (Word Bank)', html: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Progress Test 1 - Vocabulary: Weekend Activities</title>\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <style>\n        .is-correct {\n            background-color: #ecfdf5 !important;\n            border-color: #059669 !important;\n            color: #065f46 !important;\n        }\n        .is-wrong {\n            background-color: #fef2f2 !important;\n            border-color: #dc2626 !important;\n            color: #991b1b !important;\n        }\n    </style>\n</head>\n<body class=\"bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between\">\n\n    <!-- Sticky Header / Scoreboard -->\n    <header class=\"sticky top-0 bg-white/95 backdrop-blur z-20 py-3 px-4 sm:px-8 border-b w-full shadow-sm flex flex-wrap items-center justify-between gap-4\">\n        <div class=\"flex items-center gap-3\">\n            <span class=\"bg-indigo-600 text-white font-bold text-xs px-2.5 py-1 rounded-lg uppercase tracking-wider\">Progress Test 1</span>\n            <h1 class=\"text-base sm:text-lg font-bold text-slate-900\">Weekend Activities & Collocations</h1>\n        </div>\n        <div class=\"flex items-center gap-4\">\n            <div id=\"score-display\" class=\"text-sm font-semibold bg-slate-100 text-slate-700 px-3 py-1.5 rounded-full border border-slate-200\">\n                Score: <span id=\"current-score\">0</span> / <span id=\"total-score\">11</span>\n            </div>\n            <button id=\"reset-btn\" class=\"bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-medium px-3.5 py-1.5 rounded-lg transition-colors flex items-center gap-1.5 cursor-pointer\">\n                <svg class=\"w-4 h-4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15\"></path></svg>\n                Reset\n            </button>\n        </div>\n    </header>\n\n    <!-- Main Container (w-full max-w-4xl mx-auto as required) -->\n    <main class=\"w-full max-w-4xl mx-auto p-4 sm:p-6 md:p-8 flex-grow\">\n        \n        <!-- Instructions & Word Bank Card -->\n        <section class=\"bg-white border border-slate-200 rounded-2xl shadow-sm p-5 sm:p-6 mb-6\">\n            <div class=\"flex items-start gap-3 mb-4\">\n                <div class=\"p-2 bg-indigo-50 text-indigo-600 rounded-xl\">\n                    <svg class=\"w-6 h-6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253\"></path></svg>\n                </div>\n                <div>\n                    <h2 class=\"text-lg font-bold text-slate-900\">Vocabulary Exercise</h2>\n                    <p class=\"text-sm text-slate-600 mt-0.5\">Fill in the gaps with these verbs. You can use the verbs more than once.</p>\n                </div>\n            </div>\n\n            <!-- Word Bank -->\n            <div class=\"flex flex-wrap gap-2 pt-2 border-t border-slate-100\">\n                <span class=\"text-xs font-bold text-slate-400 uppercase tracking-wider self-center mr-2\">Word Bank:</span>\n                <span class=\"bg-indigo-50 text-indigo-700 text-sm font-semibold px-3 py-1 rounded-lg border border-indigo-100 shadow-2xs\">do</span>\n                <span class=\"bg-indigo-50 text-indigo-700 text-sm font-semibold px-3 py-1 rounded-lg border border-indigo-100 shadow-2xs\">chat</span>\n                <span class=\"bg-indigo-50 text-indigo-700 text-sm font-semibold px-3 py-1 rounded-lg border border-indigo-100 shadow-2xs\">visit</span>\n                <span class=\"bg-indigo-50 text-indigo-700 text-sm font-semibold px-3 py-1 rounded-lg border border-indigo-100 shadow-2xs\">tidy up</span>\n                <span class=\"bg-indigo-50 text-indigo-700 text-sm font-semibold px-3 py-1 rounded-lg border border-indigo-100 shadow-2xs\">have</span>\n                <span class=\"bg-indigo-50 text-indigo-700 text-sm font-semibold px-3 py-1 rounded-lg border border-indigo-100 shadow-2xs\">go</span>\n                <span class=\"bg-indigo-50 text-indigo-700 text-sm font-semibold px-3 py-1 rounded-lg border border-indigo-100 shadow-2xs\">meet</span>\n            </div>\n        </section>\n\n        <!-- Questions Form -->\n        <form id=\"quiz-form\" class=\"bg-white border border-slate-200 rounded-2xl shadow-sm p-5 sm:p-8 space-y-4\">\n            \n            <!-- Item 1 (Example) -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2 border-b border-slate-100\">\n                <span class=\"flex-none font-bold text-slate-400 w-6 text-right\">1.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>I often</span>\n                    <input type=\"text\" value=\"do\" disabled class=\"bg-slate-100 text-slate-500 font-medium px-3 py-1.5 rounded-lg border border-slate-200 w-28 text-center cursor-not-allowed\">\n                    <span>some gardening at the weekend. <span class=\"text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded ml-1\">(Example)</span></span>\n                </div>\n            </div>\n\n            <!-- Item 2 -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2 border-b border-slate-100\">\n                <span class=\"flex-none font-bold text-slate-700 w-6 text-right\">2.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>We usually</span>\n                    <input type=\"text\" data-answer=\"visit\" autocomplete=\"off\" autocapitalize=\"none\" placeholder=\"type verb...\" class=\"bg-slate-50 focus:bg-white text-slate-800 font-medium px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all w-36 text-center\">\n                    <span>my grandmother on Sundays.</span>\n                </div>\n            </div>\n\n            <!-- Item 3 -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2 border-b border-slate-100\">\n                <span class=\"flex-none font-bold text-slate-700 w-6 text-right\">3.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>When did you last</span>\n                    <input type=\"text\" data-answer=\"tidy up\" autocomplete=\"off\" autocapitalize=\"none\" placeholder=\"type verb...\" class=\"bg-slate-50 focus:bg-white text-slate-800 font-medium px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all w-36 text-center\">\n                    <span>the flat?</span>\n                </div>\n            </div>\n\n            <!-- Item 4 -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2 border-b border-slate-100\">\n                <span class=\"flex-none font-bold text-slate-700 w-6 text-right\">4.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>I think I'll</span>\n                    <input type=\"text\" data-answer=\"have\" autocomplete=\"off\" autocapitalize=\"none\" placeholder=\"type verb...\" class=\"bg-slate-50 focus:bg-white text-slate-800 font-medium px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all w-36 text-center\">\n                    <span>a quiet night in.</span>\n                </div>\n            </div>\n\n            <!-- Item 5 -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2 border-b border-slate-100\">\n                <span class=\"flex-none font-bold text-slate-700 w-6 text-right\">5.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>We often</span>\n                    <input type=\"text\" data-answer=\"go\" autocomplete=\"off\" autocapitalize=\"none\" placeholder=\"type verb...\" class=\"bg-slate-50 focus:bg-white text-slate-800 font-medium px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all w-36 text-center\">\n                    <span>clubbing with friends.</span>\n                </div>\n            </div>\n\n            <!-- Item 6 -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2 border-b border-slate-100\">\n                <span class=\"flex-none font-bold text-slate-700 w-6 text-right\">6.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>I never</span>\n                    <input type=\"text\" data-answer=\"have\" autocomplete=\"off\" autocapitalize=\"none\" placeholder=\"type verb...\" class=\"bg-slate-50 focus:bg-white text-slate-800 font-medium px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all w-36 text-center\">\n                    <span>a lie-in on Saturday mornings.</span>\n                </div>\n            </div>\n\n            <!-- Item 7 -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2 border-b border-slate-100\">\n                <span class=\"flex-none font-bold text-slate-700 w-6 text-right\">7.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>My sister and I often</span>\n                    <input type=\"text\" data-answer=\"chat\" autocomplete=\"off\" autocapitalize=\"none\" placeholder=\"type verb...\" class=\"bg-slate-50 focus:bg-white text-slate-800 font-medium px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all w-36 text-center\">\n                    <span>to people online.</span>\n                </div>\n            </div>\n\n            <!-- Item 8 -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2 border-b border-slate-100\">\n                <span class=\"flex-none font-bold text-slate-700 w-6 text-right\">8.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>I really need to</span>\n                    <input type=\"text\" data-answer=\"do\" autocomplete=\"off\" autocapitalize=\"none\" placeholder=\"type verb...\" class=\"bg-slate-50 focus:bg-white text-slate-800 font-medium px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all w-36 text-center\">\n                    <span>some exercise.</span>\n                </div>\n            </div>\n\n            <!-- Item 9 -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2 border-b border-slate-100\">\n                <span class=\"flex-none font-bold text-slate-700 w-6 text-right\">9.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>We hardly ever</span>\n                    <input type=\"text\" data-answer=\"go\" autocomplete=\"off\" autocapitalize=\"none\" placeholder=\"type verb...\" class=\"bg-slate-50 focus:bg-white text-slate-800 font-medium px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all w-36 text-center\">\n                    <span>to exhibitions.</span>\n                </div>\n            </div>\n\n            <!-- Item 10 -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2 border-b border-slate-100\">\n                <span class=\"flex-none font-bold text-slate-700 w-6 text-right\">10.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>I sometimes</span>\n                    <input type=\"text\" data-answer=\"have\" autocomplete=\"off\" autocapitalize=\"none\" placeholder=\"type verb...\" class=\"bg-slate-50 focus:bg-white text-slate-800 font-medium px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all w-36 text-center\">\n                    <span>friends round for dinner.</span>\n                </div>\n            </div>\n\n            <!-- Item 11 -->\n            <div class=\"flex items-center gap-3 text-sm sm:text-base py-2\">\n                <span class=\"flex-none font-bold text-slate-700 w-6 text-right\">11.</span>\n                <div class=\"flex-grow flex flex-wrap items-center gap-2 text-slate-700\">\n                    <span>Sam's going to</span>\n                    <input type=\"text\" data-answer=\"meet\" autocomplete=\"off\" autocapitalize=\"none\" placeholder=\"type verb...\" class=\"bg-slate-50 focus:bg-white text-slate-800 font-medium px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all w-36 text-center\">\n                    <span>up with some friends.</span>\n                </div>\n            </div>\n\n            <!-- Submit Button Bar -->\n            <div class=\"pt-6 border-t border-slate-200 flex flex-wrap items-center justify-between gap-4\">\n                <p id=\"feedback-msg\" class=\"text-sm font-medium text-slate-500\">Fill in all gaps and click check answers.</p>\n                <button type=\"submit\" id=\"check-btn\" class=\"w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl transition-all shadow-sm cursor-pointer flex items-center justify-center gap-2 min-h-[44px]\">\n                    <svg class=\"w-5 h-5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M5 13l4 4L19 7\"></path></svg>\n                    Check Answers\n                </button>\n            </div>\n        </form>\n\n        <!-- Additional Note Section as requested by the professor -->\n        <section class=\"mt-6 bg-amber-50 border border-amber-200 rounded-2xl p-5 sm:p-6 text-amber-900 shadow-2xs\">\n            <div class=\"flex items-start gap-3\">\n                <div class=\"p-2 bg-amber-100 text-amber-700 rounded-xl mt-0.5\">\n                    <svg class=\"w-5 h-5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z\"></path></svg>\n                </div>\n                <div>\n                    <h3 class=\"font-bold text-amber-900 text-sm sm:text-base\">Additional Note / Part C Reference</h3>\n                    <p class=\"text-xs sm:text-sm text-amber-800 mt-1 leading-relaxed\">\n                        Remember to review your collocations regularly. Practice using these verb phrases in your daily conversations to build natural fluency and expand your active vocabulary for weekend routines.\n                    </p>\n                </div>\n            </div>\n        </section>\n\n    </main>\n\n    <!-- Footer -->\n    <footer class=\"text-center py-4 text-xs text-slate-400 border-t border-slate-100 mt-auto\">\n        ELT Interactive Micro-App &bull; Progress Test 1\n    </footer>\n\n    <!-- Interactive Script & Metrics Contract -->\n    <script>\n        // MANDATORY PEDAGOGICAL METRICS CONTRACT\n        window.ACTIVITY_METRICS = {\n            domain: 'Vocabulary',\n            skill: 'weekend_activities_collocations',\n            maxScore: 11\n        };\n\n        document.addEventListener('DOMContentLoaded', () => {\n            const form = document.getElementById('quiz-form');\n            const checkBtn = document.getElementById('check-btn');\n            const resetBtn = document.getElementById('reset-btn');\n            const currentScoreSpan = document.getElementById('current-score');\n            const feedbackMsg = document.getElementById('feedback-msg');\n            const inputs = form.querySelectorAll('input[data-answer]');\n\n            document.getElementById('total-score').textContent = inputs.length;\n\n            form.addEventListener('submit', (e) => {\n                e.preventDefault();\n                let correctCount = 0;\n\n                inputs.forEach(input => {\n                    const userAnswer = input.value.trim().toLowerCase();\n                    const correctAnswer = input.getAttribute('data-answer').toLowerCase();\n\n                    input.classList.remove('is-correct', 'is-wrong');\n\n                    if (userAnswer === correctAnswer) {\n                        input.classList.add('is-correct');\n                        correctCount++;\n                    } else {\n                        input.classList.add('is-wrong');\n                    }\n                });\n\n                currentScoreSpan.textContent = correctCount;\n\n                if (correctCount === inputs.length) {\n                    feedbackMsg.textContent = '🎉 Excellent! All answers are correct.';\n                    feedbackMsg.className = 'text-sm font-bold text-emerald-600';\n                } else {\n                    feedbackMsg.textContent = `You got ${correctCount} out of ${inputs.length} correct. Review the highlighted items.`;\n                    feedbackMsg.className = 'text-sm font-bold text-amber-600';\n                }\n\n                // DISPATCH MANDATORY CUSTOM EVENT & POSTMESSAGE\n                window.dispatchEvent(new CustomEvent('ELT_ACTIVITY_UPDATE', {\n                    detail: {\n                        metrics: window.ACTIVITY_METRICS,\n                        score: correctCount,\n                        total: inputs.length,\n                        completed: correctCount === inputs.length\n                    }\n                }));\n\n                try {\n                    window.parent.postMessage({\n                        type: 'ACTIVITY_SCORE',\n                        score: correctCount,\n                        total: inputs.length\n                    }, '*');\n                } catch (err) {\n                    console.log('PostMessage not available');\n                }\n            });\n\n            resetBtn.addEventListener('click', () => {\n                inputs.forEach(input => {\n                    input.value = '';\n                    input.classList.remove('is-correct', 'is-wrong');\n                });\n                currentScoreSpan.textContent = '0';\n                feedbackMsg.textContent = 'Fill in all gaps and click check answers.';\n                feedbackMsg.className = 'text-sm font-medium text-slate-500';\n            });\n        });\n    <\/script>\n</body>\n</html>", selector: '.flex.flex-wrap.gap-2 span:not(.uppercase)' }
];

const results = [];
realSlides.forEach(s => {
  const p1 = new DOMParser();
  const dOrig = p1.parseFromString(s.html, 'text/html');
  const origList = Array.from(dOrig.querySelectorAll(s.selector)).map(el => el.textContent.trim() || el.value);

  let changed = false;
  let shufList = [];
  for (let attempt = 0; attempt < 5; attempt++) {
    const shuffled = shuffleExerciseOptions(s.html);
    const p2 = new DOMParser();
    const dShuf = p2.parseFromString(shuffled, 'text/html');
    shufList = Array.from(dShuf.querySelectorAll(s.selector)).map(el => el.textContent.trim() || el.value);
    if (JSON.stringify(origList) !== JSON.stringify(shufList)) {
      changed = true;
      break;
    }
  }

  results.push({
    name: s.name,
    origList,
    shufList,
    orderChanged: changed
  });
});

document.getElementById('output-box').textContent = 'RES:' + JSON.stringify(results) + ':RES';
