    const deck = JSON.parse(decodeURIComponent(escape(atob(payload))));
    let current = 0;
    function show(idx) {
      if (idx < 0 || idx >= deck.length) return;
      current = idx;
      document.getElementById("viewer").srcdoc = deck[current].html;
      document.getElementById("counter").textContent = (current + 1) + " / " + deck.length;
    }
    function prev() { if (current > 0) show(current - 1); }
    function next() { if (current < deck.length - 1) show(current + 1); }
    window.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") prev();
      if (e.key === "ArrowRight" || e.key === " ") next();
    });
    let touchStartX = 0;
    let touchEndX = 0;
    document.body.addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
    document.body.addEventListener("touchend", e => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchStartX - touchEndX > 60) next();
      if (touchEndX - touchStartX > 60) prev();
    }, {passive: true});
    show(0);
  </script>
