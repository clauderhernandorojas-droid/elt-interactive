<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Unit 1 - Work, Studies & Routines</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    netlify-drawer, #netlify-drawer, [data-netlify-drawer], .netlify-badge {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4 md:p-8">

  <main class="max-w-4xl w-full mx-auto my-auto">
    <!-- Volver al portal -->
    <div class="mb-6">
      <a href="../index.html" class="inline-flex items-center gap-2 text-xs font-semibold text-indigo-400 hover:text-indigo-300 transition">
        ← Volver al Portal de Unidades
      </a>
    </div>

    <!-- Encabezado de la Unidad -->
    <header class="mb-8">
      <span class="inline-block px-3 py-1 bg-indigo-500/20 text-indigo-400 text-xs font-semibold uppercase tracking-wider rounded-full mb-3 border border-indigo-500/30">
        Intermediate Level
      </span>
      <h1 id="unitHeading" class="text-3xl md:text-4xl font-extrabold text-white">Unit 1: Work, Studies & Routines</h1>
      <p class="text-slate-400 mt-2 text-sm">Selecciona una lección para comenzar:</p>
    </header>

    <!-- 4 Lecciones (Generadas dinámicamente) -->
    <div id="lessonsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <!-- Se inyecta con JavaScript -->
    </div>
  </main>

  <!-- Pie de página -->
  <footer class="text-center text-xs text-slate-500 mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
    <span id="footerUnitText">Interactive ELT Deck • Unit 1</span>
    <span class="hidden sm:inline text-slate-700">•</span>
    <button onclick="openLessonsConfig()" class="text-indigo-400 hover:text-indigo-300 text-xs font-semibold hover:underline flex items-center gap-1 cursor-pointer">
      ⚙️ Configurar Lecciones
    </button>
  </footer>

  <!-- MODAL: CONFIGURAR LECCIONES DE LA UNIDAD (DOCENTE) -->
  <div id="lessonsConfigModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700/80 rounded-2xl max-w-xl w-full shadow-2xl flex flex-col overflow-hidden max-h-[90vh]">
      <!-- Encabezado -->
      <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/60">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center font-bold text-sm">
            ⚙️
          </div>
          <div>
            <h3 class="font-bold text-white text-sm md:text-base">Configuración de Lecciones - Unit 1</h3>
            <p class="text-xs text-slate-400">Edita los identificadores y títulos de las 4 lecciones.</p>
          </div>
        </div>
        <button onclick="closeLessonsConfigModal()" class="text-slate-400 hover:text-white p-1" title="Cerrar modal">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Lista de 4 Lecciones -->
      <div id="lessonsListInputs" class="p-4 md:p-6 space-y-3 overflow-y-auto flex-1 bg-slate-900/50">
        <!-- Renderizado dinámicamente -->
      </div>

      <!-- Pie del Modal -->
      <div class="p-3 md:p-4 bg-slate-950/80 border-t border-slate-800 flex flex-wrap items-center justify-between gap-2">
        <button type="button" onclick="resetLessonsToDefault()" class="text-xs text-rose-400 hover:text-rose-300 underline cursor-pointer">
          Restablecer a valores por defecto
        </button>
        <div class="flex items-center gap-2 ml-auto">
          <button type="button" onclick="closeLessonsConfigModal()" class="px-4 py-2 text-xs font-bold text-slate-400 hover:text-white">
            Cancelar
          </button>
          <button type="button" onclick="saveLessonsConfig()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold shadow-sm transition flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            <span>Guardar Lecciones</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const UNIT_NUMBER = 1;
    const TEACHER_PIN = 'admin123';

    // Lecciones por defecto
    const defaultLessons = [
      { id: '1a', label: 'Lesson 1A', title: 'Work & Studies', file: '1a.html' },
      { id: '1b', label: 'Lesson 1B', title: 'Daily Routines', file: '1b.html' },
      { id: '1c', label: 'Lesson 1C', title: 'The Best Medicine', file: '1c.html' },
      { id: '1d', label: 'Lesson 1D', title: 'Review & Extension', file: '1d.html' }
    ];

    function getLessonsData() {
      try {
        const saved = localStorage.getItem(`elt_custom_lessons_unit_${UNIT_NUMBER}`);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length === defaultLessons.length) {
            return defaultLessons.map((def, idx) => ({
              ...def,
              label: (parsed[idx] && parsed[idx].label && parsed[idx].label.trim()) || def.label,
              title: (parsed[idx] && parsed[idx].title && parsed[idx].title.trim()) || def.title
            }));
          }
        }
      } catch (e) {}
      return JSON.parse(JSON.stringify(defaultLessons));
    }

    function syncUnitTitleFromPortal() {
      try {
        const savedTitles = localStorage.getItem('elt_custom_unit_titles');
        if (savedTitles) {
          const parsed = JSON.parse(savedTitles);
          const uData = parsed.find(u => u.id === UNIT_NUMBER);
          if (uData && (uData.title || uData.topic)) {
            const fullTitle = `${uData.title || 'Unit ' + UNIT_NUMBER}: ${uData.topic || ''}`.trim();
            document.getElementById('unitHeading').textContent = fullTitle;
            document.title = fullTitle;
            document.getElementById('footerUnitText').textContent = `Interactive ELT Deck • ${uData.title || 'Unit ' + UNIT_NUMBER}`;
            return;
          }
        }
      } catch (e) {}
    }

    function renderLessons() {
      const container = document.getElementById('lessonsGrid');
      if (!container) return;
      const lessons = getLessonsData();
      container.innerHTML = '';

      lessons.forEach(lesson => {
        const card = document.createElement('a');
        card.href = lesson.file;
        card.className = "p-5 bg-slate-800/90 border border-slate-700/60 rounded-2xl shadow-lg hover:border-indigo-400 hover:scale-[1.01] transition duration-200 flex items-center justify-between group";
        card.innerHTML = `
          <div>
            <span class="text-xs font-bold text-indigo-400">${escapeHtml(lesson.label)}</span>
            <h2 class="text-lg font-bold text-white group-hover:text-indigo-300 transition mt-0.5">${escapeHtml(lesson.title)}</h2>
          </div>
          <span class="text-xs text-indigo-400 font-bold group-hover:translate-x-1 transition">Iniciar →</span>
        `;
        container.appendChild(card);
      });
    }

    function openLessonsConfig() {
      const pin = prompt(`Ingresa el PIN de docente para configurar las lecciones de Unit ${UNIT_NUMBER}:`);
      if (!pin) return;
      if (pin.trim() === TEACHER_PIN || pin.trim() === '6578') {
        populateLessonsConfigModal();
        document.getElementById('lessonsConfigModal').classList.remove('hidden');
      } else {
        alert("PIN incorrecto.");
      }
    }

    function closeLessonsConfigModal() {
      document.getElementById('lessonsConfigModal').classList.add('hidden');
    }

    function populateLessonsConfigModal() {
      const listEl = document.getElementById('lessonsListInputs');
      if (!listEl) return;
      const currentLessons = getLessonsData();
      listEl.innerHTML = '';

      currentLessons.forEach((lesson, idx) => {
        const row = document.createElement('div');
        row.className = "p-3 bg-slate-800/80 border border-slate-700/60 rounded-xl flex flex-col sm:flex-row items-center gap-3";
        row.innerHTML = `
          <div class="flex items-center gap-2 shrink-0 self-start sm:self-center">
            <span class="w-7 h-7 rounded-lg bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center font-bold text-xs">${idx + 1}</span>
          </div>
          <div class="w-full sm:w-36 shrink-0">
            <label class="block text-[10px] font-bold text-slate-400 mb-1">Identificador:</label>
            <input type="text" id="lesson-label-${idx}" class="w-full text-xs font-bold text-white bg-slate-900 border border-slate-700 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" value="${escapeHtml(lesson.label)}" placeholder="Ej: Lesson ${UNIT_NUMBER}A">
          </div>
          <div class="w-full flex-1">
            <label class="block text-[10px] font-bold text-slate-400 mb-1">Título de la Lección:</label>
            <input type="text" id="lesson-title-${idx}" class="w-full text-xs text-slate-200 bg-slate-900 border border-slate-700 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" value="${escapeHtml(lesson.title)}" placeholder="Ej: Nombre de la lección...">
          </div>
        `;
        listEl.appendChild(row);
      });
    }

    function saveLessonsConfig() {
      const currentLessons = getLessonsData();
      const updated = [];
      for (let i = 0; i < currentLessons.length; i++) {
        const lInput = document.getElementById(`lesson-label-${i}`);
        const tInput = document.getElementById(`lesson-title-${i}`);
        updated.push({
          id: defaultLessons[i].id,
          label: lInput ? lInput.value.trim() : defaultLessons[i].label,
          title: tInput ? tInput.value.trim() : defaultLessons[i].title,
          file: defaultLessons[i].file
        });
      }
      try {
        localStorage.setItem(`elt_custom_lessons_unit_${UNIT_NUMBER}`, JSON.stringify(updated));
      } catch (e) {
        console.warn("No se pudo persistir en localStorage:", e);
      }
      renderLessons();
      closeLessonsConfigModal();
    }

    function resetLessonsToDefault() {
      if (confirm(`¿Deseas restablecer los nombres de las 4 lecciones de Unit ${UNIT_NUMBER} a sus valores predeterminados?`)) {
        try {
          localStorage.removeItem(`elt_custom_lessons_unit_${UNIT_NUMBER}`);
        } catch (e) {}
        renderLessons();
        populateLessonsConfigModal();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Inicializar
    syncUnitTitleFromPortal();
    renderLessons();
  </script>
</body>
</html>
