<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate English</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    netlify-drawer, #netlify-drawer, [data-netlify-drawer], .netlify-badge {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4 md:p-8">

  <main class="max-w-5xl w-full mx-auto my-auto">
    <!-- Encabezado -->
    <header class="text-center mb-8">
      <span class="inline-block px-3 py-1 bg-indigo-500/20 text-indigo-400 text-xs font-semibold uppercase tracking-wider rounded-full mb-3 border border-indigo-500/30">
        Interactive Course Portal
      </span>
      <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight text-white">Intermediate</h1>
      <p class="text-slate-400 mt-2 text-sm md:text-base">Selecciona tu unidad para ver las lecciones interactivas</p>
    </header>

    <!-- Cuadrícula de 12 Unidades -->
    <div id="unitsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4">
      <!-- Se generan o inicializan dinámicamente con JavaScript -->
    </div>
  </main>

  <footer class="text-center text-xs text-slate-500 mt-8 flex flex-col sm:flex-row items-center justify-center gap-2">
    <span>Interactive ELT Deck • Intermediate Level</span>
    <button onclick="resetLockedUnits()" class="text-slate-600 hover:text-slate-400 text-[10px] underline ml-2">
      Bloquear todo de nuevo
    </button>
  </footer>

  <script>
    // Define tu clave secreta de docente
    const TEACHER_PIN = '6578';

    // Configuración de las 12 Unidades
    const unitsData = [
      { id: 1, title: 'Unit 1', topic: 'Work, Studies & Routines', folder: 'UNIT 1', defaultUnlocked: true },
      { id: 2, title: 'Unit 2', topic: 'Free Time & Leisure', folder: 'UNIT 2', defaultUnlocked: false },
      { id: 3, title: 'Unit 3', topic: 'Travel & Holidays', folder: 'UNIT 3', defaultUnlocked: false },
      { id: 4, title: 'Unit 4', topic: 'Changes & Life Events', folder: 'UNIT 4', defaultUnlocked: false },
      { id: 5, title: 'Unit 5', topic: 'Feelings & Opinions', folder: 'UNIT 5', defaultUnlocked: false },
      { id: 6, title: 'Unit 6', topic: 'Consumer Society', folder: 'UNIT 6', defaultUnlocked: false },
      { id: 7, title: 'Unit 7', topic: 'Science & Nature', folder: 'UNIT 7', defaultUnlocked: false },
      { id: 8, title: 'Unit 8', topic: 'Relationships', folder: 'UNIT 8', defaultUnlocked: false },
      { id: 9, title: 'Unit 9', topic: 'Media & Culture', folder: 'UNIT 9', defaultUnlocked: false },
      { id: 10, title: 'Unit 10', topic: 'Rules & Freedom', folder: 'UNIT 10', defaultUnlocked: false },
      { id: 11, title: 'Unit 11', topic: 'Future Predictions', folder: 'UNIT 11', defaultUnlocked: false },
      { id: 12, title: 'Unit 12', topic: 'Review & Achievements', folder: 'UNIT 12', defaultUnlocked: false }
    ];

    function getUnlockedUnits() {
      try {
        const saved = localStorage.getItem('elt_unlocked_units');
        return saved ? JSON.parse(saved) : [1];
      } catch (e) {
        return [1];
      }
    }

    function saveUnlockedUnits(unlocked) {
      try {
        localStorage.setItem('elt_unlocked_units', JSON.stringify(unlocked));
      } catch (e) {}
    }

    function renderUnits() {
      const container = document.getElementById('unitsGrid');
      const unlockedIds = getUnlockedUnits();
      container.innerHTML = '';

      unitsData.forEach(unit => {
        const isUnlocked = unit.defaultUnlocked || unlockedIds.includes(unit.id);

        if (isUnlocked) {
          // Tarjeta Desbloqueada (Interactiva con enlace)
          const card = document.createElement('a');
          card.href = `${unit.folder}/index.html`;
          card.className = "group relative p-5 bg-slate-800/90 border border-indigo-500/40 rounded-2xl shadow-lg hover:border-indigo-400 hover:shadow-indigo-500/20 hover:scale-[1.02] transition duration-200 flex flex-col justify-between";
          card.innerHTML = `
            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-bold px-2 py-0.5 rounded bg-indigo-500 text-white">4 Lecciones</span>
              <span class="text-xs text-indigo-400 group-hover:translate-x-1 transition font-bold">Entrar →</span>
            </div>
            <div>
              <h2 class="text-xl font-bold text-white group-hover:text-indigo-300 transition">${unit.title}</h2>
              <p class="text-xs text-slate-400 mt-1">${unit.topic}</p>
            </div>
          `;
          container.appendChild(card);
        } else {
          // Tarjeta Bloqueada (Con candado clickeable para docente)
          const card = document.createElement('div');
          card.className = "p-5 bg-slate-800/40 border border-slate-700/50 rounded-2xl opacity-60 flex flex-col justify-between select-none";
          card.innerHTML = `
            <div class="flex items-center justify-between mb-3">
              <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-slate-700 text-slate-400">Próximamente</span>
              <button onclick="promptUnlock(${unit.id})" title="Hacer clic para desbloquear con PIN de docente" class="text-slate-400 hover:text-amber-400 hover:scale-125 transition p-1 text-sm cursor-pointer">
                🔒
              </button>
            </div>
            <div>
              <h2 class="text-xl font-bold text-slate-300">${unit.title}</h2>
              <p class="text-xs text-slate-500 mt-1">${unit.topic}</p>
            </div>
          `;
          container.appendChild(card);
        }
      });
    }

    function promptUnlock(unitId) {
      const pin = prompt("Ingresa la clave de docente para desbloquear esta unidad:");
      if (!pin) return;

      if (pin.trim() === TEACHER_PIN) {
        const unlocked = getUnlockedUnits();
        if (!unlocked.includes(unitId)) {
          unlocked.push(unitId);
          saveUnlockedUnits(unlocked);
        }
        renderUnits();
      } else {
        alert("Clave incorrecta.");
      }
    }

    function resetLockedUnits() {
      if (confirm("¿Deseas bloquear nuevamente todas las unidades excepto la Unit 1?")) {
        localStorage.removeItem('elt_unlocked_units');
        renderUnits();
      }
    }

    // Inicializar al cargar
    renderUnits();
  </script>

</body>
</html>
