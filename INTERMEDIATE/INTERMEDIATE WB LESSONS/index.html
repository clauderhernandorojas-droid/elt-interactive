<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate English</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Prevenir selección accidental al hacer clic rápido en candados */
    button { -webkit-tap-highlight-color: transparent; }
    netlify-drawer, #netlify-drawer, [data-netlify-drawer], .netlify-badge {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4 md:p-8">

  <main class="max-w-5xl w-full mx-auto my-auto">
    <!-- Encabezado -->
    <header class="text-center mb-8">
      <span class="inline-block px-3 py-1 bg-indigo-500/20 text-indigo-400 text-xs font-semibold uppercase tracking-wider rounded-full mb-3 border border-indigo-500/30">
        Interactive Course Portal
      </span>
      <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight text-white">Intermediate</h1>
      <p class="text-slate-400 mt-2 text-sm md:text-base">Selecciona tu unidad para ver las lecciones interactivas</p>
    </header>

    <!-- Cuadrícula de 12 Unidades -->
    <div id="unitsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4">
      <!-- Se inyecta dinámicamente con JavaScript -->
    </div>
  </main>

  <!-- Pie de página -->
  <footer class="text-center text-xs text-slate-500 mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
    <span>Interactive ELT Deck • Intermediate Level</span>
    <div class="flex items-center gap-2">
      <button onclick="resetLockedUnits()" class="text-slate-600 hover:text-slate-400 text-[11px] underline cursor-pointer">
        Bloquear todo de nuevo
      </button>
      <span class="text-slate-700">•</span>
      <button onclick="openUnitTitlesConfig()" class="text-indigo-400 hover:text-indigo-300 text-xs font-semibold hover:underline flex items-center gap-1 cursor-pointer">
        ⚙️ Configurar Nombres
      </button>
    </div>
  </footer>

  <!-- MODAL: CONFIGURAR NOMBRES DE UNIDADES (DOCENTE) -->
  <div id="unitTitlesModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700/80 rounded-2xl max-w-2xl w-full shadow-2xl flex flex-col overflow-hidden max-h-[90vh]">
      <!-- Encabezado -->
      <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/60">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center font-bold text-sm">
            ⚙️
          </div>
          <div>
            <h3 class="font-bold text-white text-sm md:text-base">Configuración de Nombres de Unidades</h3>
            <p class="text-xs text-slate-400">Edita los títulos y temas de las 12 unidades del curso.</p>
          </div>
        </div>
        <button onclick="closeUnitTitlesModal()" class="text-slate-400 hover:text-white p-1" title="Cerrar modal">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Lista de 12 Unidades -->
      <div id="unitTitlesList" class="p-4 md:p-6 space-y-3 overflow-y-auto flex-1 bg-slate-900/50">
        <!-- Generado dinámicamente -->
      </div>

      <!-- Pie del Modal -->
      <div class="p-3 md:p-4 bg-slate-950/80 border-t border-slate-800 flex flex-wrap items-center justify-between gap-2">
        <button type="button" onclick="resetUnitTitlesToDefault()" class="text-xs text-rose-400 hover:text-rose-300 underline cursor-pointer">
          Restablecer a valores por defecto
        </button>
        <div class="flex items-center gap-2 ml-auto">
          <button type="button" onclick="closeUnitTitlesModal()" class="px-4 py-2 text-xs font-bold text-slate-400 hover:text-white">
            Cancelar
          </button>
          <button type="button" onclick="saveUnitTitles()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold shadow-sm transition flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            <span>Guardar Nombres</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Clave secreta de docente
    const TEACHER_PIN = 'admin123';

    // Lista por defecto de las 12 Unidades del Curso
    const defaultUnitsData = [
      { id: 1, title: 'Unit 1', topic: 'Work, Studies & Routines', folder: 'UNIT 1' },
      { id: 2, title: 'Unit 2', topic: 'Free Time & Leisure', folder: 'UNIT 2' },
      { id: 3, title: 'Unit 3', topic: 'Travel & Holidays', folder: 'UNIT 3' },
      { id: 4, title: 'Unit 4', topic: 'Changes & Life Events', folder: 'UNIT 4' },
      { id: 5, title: 'Unit 5', topic: 'Feelings & Opinions', folder: 'UNIT 5' },
      { id: 6, title: 'Unit 6', topic: 'Consumer Society', folder: 'UNIT 6' },
      { id: 7, title: 'Unit 7', topic: 'Science & Nature', folder: 'UNIT 7' },
      { id: 8, title: 'Unit 8', topic: 'Relationships', folder: 'UNIT 8' },
      { id: 9, title: 'Unit 9', topic: 'Media & Culture', folder: 'UNIT 9' },
      { id: 10, title: 'Unit 10', topic: 'Rules & Freedom', folder: 'UNIT 10' },
      { id: 11, title: 'Unit 11', topic: 'Future Predictions', folder: 'UNIT 11' },
      { id: 12, title: 'Unit 12', topic: 'Review & Achievements', folder: 'UNIT 12' }
    ];

    function getUnitsData() {
      try {
        const saved = localStorage.getItem('elt_custom_unit_titles');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length === defaultUnitsData.length) {
            return defaultUnitsData.map((def, idx) => ({
              ...def,
              title: (parsed[idx] && parsed[idx].title && parsed[idx].title.trim()) || def.title,
              topic: (parsed[idx] && parsed[idx].topic && parsed[idx].topic.trim()) || def.topic
            }));
          }
        }
      } catch (e) {}
      return JSON.parse(JSON.stringify(defaultUnitsData));
    }

    function getUnlockedUnits() {
      try {
        const saved = localStorage.getItem('elt_unlocked_units');
        return saved ? JSON.parse(saved) : [1]; // Unit 1 desbloqueada por defecto
      } catch (e) {
        return [1];
      }
    }

    function saveUnlockedUnits(unlocked) {
      try {
        localStorage.setItem('elt_unlocked_units', JSON.stringify(unlocked));
      } catch (e) {}
    }

    function renderUnits() {
      const container = document.getElementById('unitsGrid');
      if (!container) return;
      const unlockedIds = getUnlockedUnits();
      const units = getUnitsData();
      container.innerHTML = '';

      units.forEach(unit => {
        const isUnlocked = unlockedIds.includes(unit.id);

        if (isUnlocked) {
          // TARJETA DESBLOQUEADA
          const card = document.createElement('a');
          card.href = `${unit.folder}/index.html`;
          card.className = "group relative p-5 bg-slate-800/90 border border-indigo-500/40 rounded-2xl shadow-lg hover:border-indigo-400 hover:shadow-indigo-500/20 hover:scale-[1.02] transition duration-200 flex flex-col justify-between";
          card.innerHTML = `
            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-bold px-2 py-0.5 rounded bg-indigo-500 text-white">4 Lecciones</span>
              <div class="flex items-center gap-2">
                <span class="text-xs text-indigo-400 group-hover:translate-x-0.5 transition font-bold">Entrar →</span>
                <button onclick="toggleLock(${unit.id}, event)" title="Hacer clic para bloquear esta unidad (requiere PIN)" class="text-emerald-400 hover:text-rose-400 hover:scale-125 transition p-1 text-sm cursor-pointer z-10" aria-label="Bloquear unidad">
                  🔓
                </button>
              </div>
            </div>
            <div>
              <h2 class="text-xl font-bold text-white group-hover:text-indigo-300 transition">${escapeHtml(unit.title)}</h2>
              <p class="text-xs text-slate-400 mt-1">${escapeHtml(unit.topic)}</p>
            </div>
          `;
          container.appendChild(card);
        } else {
          // TARJETA BLOQUEADA
          const card = document.createElement('div');
          card.className = "p-5 bg-slate-800/40 border border-slate-700/50 rounded-2xl opacity-60 flex flex-col justify-between select-none";
          card.innerHTML = `
            <div class="flex items-center justify-between mb-3">
              <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-slate-700 text-slate-400">Próximamente</span>
              <button onclick="toggleLock(${unit.id}, event)" title="Hacer clic para desbloquear con PIN de docente" class="text-slate-400 hover:text-amber-400 hover:scale-125 transition p-1 text-sm cursor-pointer" aria-label="Desbloquear unidad">
                🔒
              </button>
            </div>
            <div>
              <h2 class="text-xl font-bold text-slate-300">${escapeHtml(unit.title)}</h2>
              <p class="text-xs text-slate-500 mt-1">${escapeHtml(unit.topic)}</p>
            </div>
          `;
          container.appendChild(card);
        }
      });
    }

    function toggleLock(unitId, event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      let unlocked = getUnlockedUnits();
      const isCurrentlyUnlocked = unlocked.includes(unitId);

      const actionMsg = isCurrentlyUnlocked 
        ? "Ingresa la clave de docente para BLOQUEAR nuevamente esta unidad:" 
        : "Ingresa la clave de docente para DESBLOQUEAR esta unidad:";

      const pin = prompt(actionMsg);
      if (!pin) return;

      if (pin.trim() === TEACHER_PIN || pin.trim() === '6578') {
        if (isCurrentlyUnlocked) {
          unlocked = unlocked.filter(id => id !== unitId);
        } else {
          unlocked.push(unitId);
        }
        saveUnlockedUnits(unlocked);
        renderUnits();
      } else {
        alert("Clave incorrecta.");
      }
    }

    function resetLockedUnits() {
      if (confirm("¿Deseas bloquear nuevamente todas las unidades excepto la Unit 1?")) {
        try {
          localStorage.setItem('elt_unlocked_units', JSON.stringify([1]));
        } catch (e) {}
        renderUnits();
      }
    }

    // Modal de Configuración de Nombres
    function openUnitTitlesConfig() {
      const pin = prompt("Ingresa el PIN de docente para configurar los nombres de las unidades:");
      if (!pin) return;
      if (pin.trim() === TEACHER_PIN || pin.trim() === '6578') {
        populateUnitTitlesModal();
        document.getElementById('unitTitlesModal').classList.remove('hidden');
      } else {
        alert("PIN incorrecto.");
      }
    }

    function closeUnitTitlesModal() {
      document.getElementById('unitTitlesModal').classList.add('hidden');
    }

    function populateUnitTitlesModal() {
      const listEl = document.getElementById('unitTitlesList');
      if (!listEl) return;
      const currentUnits = getUnitsData();
      listEl.innerHTML = '';

      currentUnits.forEach((unit, idx) => {
        const row = document.createElement('div');
        row.className = "p-3 bg-slate-800/80 border border-slate-700/60 rounded-xl flex flex-col sm:flex-row items-center gap-3";
        row.innerHTML = `
          <div class="flex items-center gap-2 shrink-0 self-start sm:self-center">
            <span class="w-7 h-7 rounded-lg bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center font-bold text-xs">${idx + 1}</span>
          </div>
          <div class="w-full sm:w-36 shrink-0">
            <label class="block text-[10px] font-bold text-slate-400 mb-1">Nombre / Unidad:</label>
            <input type="text" id="unit-title-${idx}" class="w-full text-xs font-bold text-white bg-slate-900 border border-slate-700 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" value="${escapeHtml(unit.title)}" placeholder="Ej: Unit ${idx + 1}">
          </div>
          <div class="w-full flex-1">
            <label class="block text-[10px] font-bold text-slate-400 mb-1">Tema / Subtítulo:</label>
            <input type="text" id="unit-topic-${idx}" class="w-full text-xs text-slate-200 bg-slate-900 border border-slate-700 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" value="${escapeHtml(unit.topic)}" placeholder="Ej: Tema de la unidad...">
          </div>
        `;
        listEl.appendChild(row);
      });
    }

    function saveUnitTitles() {
      const currentUnits = getUnitsData();
      const updated = [];
      for (let i = 0; i < currentUnits.length; i++) {
        const tInput = document.getElementById(`unit-title-${i}`);
        const sInput = document.getElementById(`unit-topic-${i}`);
        updated.push({
          id: i + 1,
          title: tInput ? tInput.value.trim() : defaultUnitsData[i].title,
          topic: sInput ? sInput.value.trim() : defaultUnitsData[i].topic
        });
      }
      try {
        localStorage.setItem('elt_custom_unit_titles', JSON.stringify(updated));
      } catch (e) {
        console.warn("No se pudo persistir en localStorage:", e);
      }
      renderUnits();
      closeUnitTitlesModal();
    }

    function resetUnitTitlesToDefault() {
      if (confirm("¿Deseas restablecer los nombres y temas de las 12 unidades a sus valores predeterminados?")) {
        try {
          localStorage.removeItem('elt_custom_unit_titles');
        } catch (e) {}
        renderUnits();
        populateUnitTitlesModal();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Inicializar al cargar el documento
    renderUnits();
  </script>
</body>
</html>
